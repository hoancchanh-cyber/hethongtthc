<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cổng Dịch Vụ Công - Hệ Thống Một Cửa</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary-blue: #00468c;
            --text-main: #1c1e21;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Tối ưu hóa trải nghiệm người dùng */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 0;
        }

        /* Tiêu đề linh hoạt */
        .header {
            text-align: center;
            margin-bottom: clamp(30px, 8vw, 50px);
        }

        .header h3 {
            color: #007bff;
            font-size: clamp(12px, 3vw, 14px);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .header h1 {
            color: var(--primary-blue);
            font-size: clamp(22px, 6vw, 32px);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .header p {
            color: #606770;
            font-size: clamp(14px, 4vw, 16px);
            max-width: 700px;
            margin: 0 auto;
        }

        /* --- LƯỚI LINH HOẠT TỰ ĐỘNG (AUTO-FIT) --- */
        .grid {
            display: grid;
            /* Tự động tính toán số cột: mỗi cột tối thiểu 180px, tối đa 1 phần đều nhau */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        /* CARD STYLE - Tối ưu cho cảm ứng */
        .card {
            background: #ffffff;
            border-radius: 16px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
            border-top: 6px solid #ccc;
            transition: var(--transition);
            box-shadow: var(--card-shadow);
            aspect-ratio: 1 / 0.7; /* Giữ tỷ lệ ô cân đối */
            min-height: 160px;
        }

        .card:active { transform: scale(0.95); } /* Hiệu ứng nhấn trên điện thoại */

        @media (min-width: 1024px) {
            .card:hover {
                transform: translateY(-8px);
                box-shadow: 0 15px 30px rgba(0,0,0,0.12);
            }
        }

        .icon-box {
            width: clamp(50px, 12vw, 60px);
            height: clamp(50px, 12vw, 60px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            transition: var(--transition);
        }

        .icon-box img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }

        .card-title {
            color: #1c1e21;
            font-weight: 700;
            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.3;
        }

        /* MÀU SẮC */
        .blue { border-top-color: #007bff; } .blue .icon-box { background: #e7f3ff; }
        .green { border-top-color: #28a745; } .green .icon-box { background: #e6f4ea; }
        .red { border-top-color: #dc3545; } .red .icon-box { background: #fdecea; }
        .purple { border-top-color: #6f42c1; } .purple .icon-box { background: #f3e8fd; }
        .orange { border-top-color: #fd7e14; } .orange .icon-box { background: #fff4e5; }
        .cyan { border-top-color: #17a2b8; } .cyan .icon-box { background: #e2f6f9; }
        .indigo { border-top-color: #6610f2; } .indigo .icon-box { background: #eef0ff; }
        .teal { border-top-color: #20c997; } .teal .icon-box { background: #e6faf5; }
        .lime { border-top-color: #8bc34a; } .lime .icon-box { background: #f1f8e9; }
        .pink { border-top-color: #e83e8c; } .pink .icon-box { background: #fdf0f5; }

        /* ĐIỀU CHỈNH RIÊNG CHO MÀN HÌNH NHỎ (MOBILE) */
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr); /* Mobile hiện 2 cột cho hiện đại */
                gap: 12px;
            }
            .card {
                padding: 15px 10px;
                aspect-ratio: auto;
                min-height: 140px;
            }
            .icon-box { margin-bottom: 10px; }
        }

        @media (max-width: 350px) {
            .grid { grid-template-columns: 1fr; } /* Điện thoại cực nhỏ hiện 1 cột */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3>Cổng dịch vụ công</h3>
            <h1>Hệ thống một cửa các Bộ</h1>
            <p>Truy cập nhanh các cổng tiếp nhận và giải quyết thủ tục hành chính trực tuyến.</p>
        </div>
        <div id="grid-bo" class="grid"></div>

        <div class="header">
            <h3 style="color: #6610f2;">Nền tảng dùng chung</h3>
            <h1>Cổng dịch vụ công quốc gia mới</h1>
        </div>
        <div id="grid-nen-tang" class="grid"></div>
    </div>

    <script>
        const dataBo = [
            { a: "https://motcuabxd.moc.gov.vn", b: "Bộ Xây dựng", c: "blue", i: "https://img.icons8.com/fluency/96/building.png" },
            { a: "https://motcuannmt.mae.gov.vn", b: "Bộ Nông nghiệp và PTNT", c: "green", i: "https://img.icons8.com/fluency/96/sprout.png" },
            { a: "https://motcua.moh.gov.vn", b: "Bộ Y tế", c: "red", i: "https://img.icons8.com/fluency/96/heart-health.png" },
            { a: "https://motcua.moha.gov.vn", b: "Bộ Nội vụ", c: "purple", i: "https://img.icons8.com/fluency/96/government.png" },
            { a: "https://motcua.moet.gov.vn", b: "Bộ Giáo dục và Đào tạo", c: "orange", i: "https://img.icons8.com/fluency/96/graduation-cap.png" },
            { a: "https://motcua-tthc.moit.gov.vn", b: "Bộ Công Thương", c: "cyan", i: "https://img.icons8.com/fluency/96/manufacturing.png" },
            { a: "https://gqtthc.bdttg.gov.vn", b: "Bộ Dân tộc và Tôn giáo", c: "indigo", i: "https://img.icons8.com/fluency/96/pagoda.png" },
            { a: "https://motcua.mst.gov.vn", b: "Bộ Khoa học và Công nghệ", c: "teal", i: "https://img.icons8.com/fluency/96/physics.png" },
            { a: "https://motcua.moj.gov.vn", b: "Bộ Tư pháp", c: "lime", i: "https://img.icons8.com/fluency/96/scales.png" },
            { a: "https://dichvucong.bvhttdl.gov.vn/...", b: "Bộ Văn hóa, Thể thao và Du lịch", c: "pink", i: "https://img.icons8.com/fluency/96/palette.png" },
            { a: "https://motcua.gialai.gov.vn/", b: "Một cửa Gia Lai", c: "blue", i: "https://img.icons8.com/fluency/96/map.png" }
        ];

        const dataPlatform = [
            { a: "https://quantricong.dichvucong.gov.vn/sso", b: "Hệ thống điều phối", c: "indigo", i: "https://img.icons8.com/fluency/96/flow-chart.png" },
            { a: "https://phananhkiennghi.dichvucong.gov.vn/sso", b: "Hệ thống PAKN", c: "pink", i: "https://img.icons8.com/fluency/96/help.png" },
            { a: "https://csdltthc.dichvucong.gov.vn/sso", b: "Hệ thống CSDL TTHC", c: "teal", i: "https://img.icons8.com/fluency/96/database.png" },
            { a: "https://quantrithanhtoan.ndc.gov.vn/admin", b: "Hệ thống thanh toán tập trung", c: "orange", i: "https://img.icons8.com/fluency/96/bank-card-backside.png" }
        ];

        function render(data, id) {
            document.getElementById(id).innerHTML = data.map(d => `
                <a href="${d.a}" class="card ${d.c}" target="_blank" rel="noopener">
                    <div class="icon-box">
                        <img src="${d.i}" alt="icon" onerror="this.src='https://img.icons8.com/fluency/96/star.png'">
                    </div>
                    <div class="card-title">${d.b}</div>
                </a>
            `).join('');
        }

        render(dataBo, 'grid-bo');
        render(dataPlatform, 'grid-nen-tang');
    </script>
</body>
</html>
